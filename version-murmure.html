<!doctype html>
<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiche Emonsters — Version Murmure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{margin:0;height:100%;background:#1A1A2E}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#poster{transform-origin:center center;flex:none}
a{color:#1A1A2E}a:hover{color:#000}
</style>
</head>
<body>
<div id="poster" style="width: 1000px; height: 1300px; position: relative; overflow: hidden; background: #1A1A2E; font-family: 'IBM Plex Mono', 'Courier New', monospace; color: #1A1A2E; display: flex; align-items: center; justify-content: center">

  <svg aria-hidden="true" width="1000" height="1300" viewBox="0 0 1000 1300" style="position: absolute; inset: 0">

    <circle cx="40" cy="640" r="3" fill="#FFD6C4"></circle>
    <circle cx="965" cy="760" r="3" fill="#D6C7E8"></circle>
    <circle cx="55" cy="1180" r="3" fill="#B8E0D2"></circle>
  </svg>

  <div style="position: absolute; top: 26px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #D6C7E8">
    <span>Collection 2026</span>
    <span>Nº 02 — Murmure</span>
  </div>

  <div style="position: relative; width: 840px; height: 1160px; box-sizing: border-box; background: #5B4E78; border-radius: 34px 34px 24px 24px; box-shadow: inset 0 -10px 0 rgba(0,0,0,0.18), inset 0 6px 0 rgba(255,255,255,0.16), 0 34px 70px rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; padding: 34px 80px 30px">

    <div aria-hidden="true" style="width: 560px; height: 58px; border-radius: 10px; background: rgba(0,0,0,0.14); box-shadow: inset 0 3px 0 rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 12px; color: rgba(0,0,0,0.24)">EMONSTERS</div>

    <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 9px; width: 680px; margin-top: 22px; margin-bottom: 26px">
      <div style="height: 4px; border-radius: 2px; background: rgba(0,0,0,0.16)"></div>
      <div style="height: 4px; border-radius: 2px; background: rgba(0,0,0,0.16)"></div>
      <div style="height: 4px; border-radius: 2px; background: rgba(0,0,0,0.16)"></div>
    </div>

    <div style="width: 680px; height: 820px; box-sizing: border-box; background: #F4F1EA; border-radius: 8px; padding: 16px; display: flex; gap: 12px; box-shadow: 0 2px 0 rgba(0,0,0,0.22)">

      <div style="position: relative; flex: 1; border-radius: 4px; overflow: hidden; background: #2E2647">

        <svg role="img" aria-label="Murmure, monstre sombre à cornes aux yeux orange plissés et au sourire plein de crocs, entouré de pensées négatives qu’il murmure" width="596" height="788" viewBox="0 0 596 788" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%">
          <circle cx="60" cy="230" r="1.6" fill="#F4F1EA" opacity="0.7"></circle>
          <circle cx="545" cy="250" r="1.6" fill="#F4F1EA" opacity="0.7"></circle>
          <circle cx="120" cy="300" r="1.2" fill="#F4F1EA" opacity="0.5"></circle>
          <circle cx="490" cy="190" r="1.2" fill="#F4F1EA" opacity="0.5"></circle>
          <circle cx="298" cy="450" r="196" fill="none" stroke="#FFD6C4" stroke-width="1.2" opacity="0.35"></circle>

          <path d="M 0 640 Q 150 600 298 630 Q 450 660 596 615" fill="none" stroke="#B8E0D2" stroke-width="1.5" opacity="0.6"></path>
          <circle cx="66" cy="660" r="3" fill="#B8E0D2"></circle>
          <circle cx="82" cy="660" r="3" fill="#B8E0D2"></circle>
          <circle cx="508" cy="652" r="2.6" fill="#FFD6C4"></circle>
          <circle cx="520" cy="646" r="2.6" fill="#FFD6C4"></circle>
          <circle cx="532" cy="652" r="2.6" fill="#FFD6C4"></circle>
          <path d="M 226 392 Q 176 320 196 252 Q 214 330 258 368 Z" fill="#120E22"></path>
          <path d="M 370 392 Q 420 320 400 252 Q 382 330 338 368 Z" fill="#120E22"></path>
          <path d="M 180 560 Q 138 580 128 628 M 128 628 l -10 6 M 128 628 l -2 12 M 128 628 l 8 8" stroke="#120E22" stroke-width="9" fill="none" stroke-linecap="round"></path>

          <path d="M 170 680 Q 156 480 228 384 Q 298 336 368 384 Q 440 480 426 680 Z" fill="#120E22"></path>
          <path d="M 186 470 L 150 452 L 182 500 Z" fill="#120E22"></path>
          <path d="M 410 470 L 446 452 L 414 500 Z" fill="#120E22"></path>
          <path d="M 232 438 Q 262 434 290 458 Q 256 468 232 438 Z" fill="#FF6B35"></path>
          <path d="M 364 438 Q 334 434 306 458 Q 340 468 364 438 Z" fill="#FF6B35"></path>
          <ellipse cx="266" cy="451" rx="3" ry="8" fill="#120E22"></ellipse>
          <ellipse cx="330" cy="451" rx="3" ry="8" fill="#120E22"></ellipse>
          <path d="M 218 522 Q 298 600 378 522 Q 298 550 218 522 Z" fill="#FF6B35"></path>
          <path d="M 244 530 l 9 20 l 8 -16 Z" fill="#F4F1EA"></path>
          <path d="M 276 536 l 6 12 l 6 -11 Z" fill="#F4F1EA"></path>
          <path d="M 308 537 l 6 11 l 6 -12 Z" fill="#F4F1EA"></path>
          <path d="M 335 534 l 8 16 l 9 -20 Z" fill="#F4F1EA"></path>
          <text x="34" y="360" transform="rotate(-8 34 360)" font-family="IBM Plex Mono, monospace" font-size="14" font-style="italic" fill="#D6C7E8">t’es pas à la hauteur…</text>
          <text x="392" y="290" transform="rotate(7 392 290)" font-family="IBM Plex Mono, monospace" font-size="14" font-style="italic" fill="#D6C7E8">ils vont se moquer</text>
          <text x="440" y="560" transform="rotate(-5 440 560)" font-family="IBM Plex Mono, monospace" font-size="14" font-style="italic" fill="#D6C7E8">à quoi bon ?</text>
          <path d="M 0 690 Q 160 660 298 676 Q 450 694 596 668 L 596 788 L 0 788 Z" fill="#2C423C"></path>
        </svg>

        <div style="position: absolute; top: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
          <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: 3px; color: #FF6B35; text-shadow: 0 4px 0 #120E22">EMONSTERS</h1>
          <div style="width: 40px; height: 2px; background: #FF6B35"></div>
          <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #D6C7E8">Un jeu sur les monstres intérieurs</p>
        </div>

        <div style="position: absolute; left: 20px; bottom: 22px; border: 1.5px solid #F4F1EA; border-radius: 3px; padding: 7px 12px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #F4F1EA">Version Murmure</div>

        <div style="position: absolute; right: 20px; bottom: 18px; width: 84px; height: 84px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #F4F1EA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #F4F1EA; text-align: center">
          <span style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 16px; line-height: 1">Nº 02</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 10px; line-height: 1.2; letter-spacing: 0.5px; text-transform: uppercase; max-width: 70px">À apprivoiser</span>
        </div>
      </div>

      <div style="width: 40px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0">
        <span style="writing-mode: vertical-rl; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 3px; color: #1A1A2E">EMO-MURM-FRA</span>
        <span style="writing-mode: vertical-rl; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 3px; color: #1A1A2E">CE CÔTÉ VERS LE CŒUR</span>
      </div>
    </div>

    <p style="margin: 30px 0 0; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: 4px; text-transform: uppercase; color: #F4F1EA">Apprivoiser ses émotions, ensemble</p>

    <svg aria-hidden="true" width="40" height="36" viewBox="0 0 18 16" style="margin-top: auto"><path d="M 9 15 C 3 10 1 7 1 4.5 C 1 2.5 2.7 1 4.6 1 C 6.4 1 7.8 2 9 3.6 C 10.2 2 11.6 1 13.4 1 C 15.3 1 17 2.5 17 4.5 C 17 7 15 10 9 15 Z" fill="rgba(0,0,0,0.2)"></path></svg>
  </div>
</div>
<script>
  function fit(){var p=document.getElementById('poster');var s=Math.min(window.innerWidth/1000,window.innerHeight/1300);p.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
